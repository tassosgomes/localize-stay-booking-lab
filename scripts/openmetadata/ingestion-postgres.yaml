# Config de ingestion do OpenMetadata — versionada para reprodutibilidade.
# Executada automaticamente pelo job `catalog-metadata` do CI a cada push em
# main (ver scripts/openmetadata/README.md); também pode ser rodada
# manualmente contra o ambiente real (mesmo README).
#
# Escopo: connector Postgres consultando `postgres-main`, filtrado ao database
# `localize_stay` (4 schemas: catalog, booking, payment, integration).
# Credenciais SEMPRE via variável de ambiente no executor da ingestion
# (nunca versionadas): OM_POSTGRES_PASSWORD. O usuário de ingestion tem escopo
# de leitura.
source:
  type: postgres
  serviceName: localize-stay-postgres
  serviceConnection:
    config:
      type: Postgres
      # Host/porta LAN do postgres-main (mesmas vars.POSTGRES_MAIN_HOST/PORT
      # usadas pelo job migrate) — NÃO o nome de serviço interno do Docker
      # (`postgres-main`), que só resolve dentro da rede do Coolify e não a
      # partir do runner self-hosted na LAN.
      hostPort: ${OM_POSTGRES_HOST_PORT}
      username: openmetadata_reader
      # Injetada no ambiente de execução — ver comentário no topo.
      password: ${OM_POSTGRES_PASSWORD}
      database: localize_stay
      ingestAllDatabases: false
  sourceConfig:
    config:
      # Filtra TUDO exceto o database do projeto (mesmo Postgres compartilhado
      # hospeda outros projetos; o catálogo do ecad-sba não deve ser poluído).
      databaseFilterPattern:
        includes:
          - localize_stay
      schemaFilterPattern:
        includes:
          - catalog
          - booking
          - payment
          - integration
      # Só metadados (schemas/tabelas); sem profiler/lineage nesta fase.
      includeTables: true
      includeViews: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    # Base da API do ecad-dev-openmetadata; token via ambiente no executor.
    hostPort: ${OM_SERVER_HOST_PORT}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_INGESTION_JWT}
    # Toda entidade ingerida recebe a tag de ownership do projeto.
    # (Aplicar também `localize-stay` como owner/team na UI após a ingestion.)
