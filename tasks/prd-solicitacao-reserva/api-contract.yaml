openapi: 3.1.0

info:
  title: "Booking - Solicitação de Reserva API"
  description: |
    Contrato síncrono para a feature Booking F01 — Solicitação de Reserva.

    **Contrato gerado a partir do PRD:** `tasks/prd-solicitacao-reserva/prd.md`
    **Data de geração:** 2026-09-12

    ## Premissas Adotadas
    - **Autenticação:** nenhuma na Fase 0 (`context/architecture-baseline.md` §Segurança); toda operação
      declara `security: []` explicitamente.
    - **Versionamento:** prefixo de rota `/v1/`, consistente com o baseline.
    - **Moeda:** Real brasileiro (BRL) fixo em todo valor monetário (PD-001); sem campo de moeda variável.
    - **Valores monetários:** string decimal com 2 casas (ex.: `"350.00"`), nunca número de ponto flutuante.
    - **Identificadores:** `accommodationId` como UUID; `guestReference` (Guest de referência) como string
      livre, sem validação de identidade real (PD-002).
    - **Nomenclatura:** `camelCase` nos campos JSON; paths em inglês, plural, kebab-case.
    - **Erros:** seguem RFC 9457 (Problem Details for HTTP APIs), `Content-Type: application/problem+json`;
      o campo de extensão `code` carrega o motivo de negócio legível por máquina.
    - **Escopo:** este documento cobre a API pública de Booking (`POST /reservations`, tag `Reservations`) e,
      como contrato mínimo/provisório, o endpoint síncrono de Catalog do qual Booking depende para validar a
      solicitação (tag `Catalog Availability (dependency)`). Catalog F04 (Consulta de Disponibilidade) ainda
      não tem PRD nem contrato próprio — este endpoint é um rascunho para destravar a TechSpec de Booking F01
      e deve ser substituído/ratificado quando Catalog especificar sua própria feature.
  version: "1.0.0"
  contact:
    name: "Domínio Booking — Localize Stay Booking Lab"

servers:
  - url: http://localhost:5000/v1
    description: Booking — desenvolvimento local

tags:
  - name: Catalog Availability (dependency)
    description: >-
      Endpoint síncrono mínimo de Catalog, consumido internamente por Booking para validar
      existência/status/capacidade/disponibilidade/preço (RN-04). Contrato provisório — não é consumido
      pelo frontend.
  - name: Reservations
    description: >-
      Solicitação e dados iniciais da Reservation (Booking F01). Consumida pelo frontend de teste.

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:

  /reservations:
    post:
      summary: Solicitar reserva
      description: |
        Um Guest solicita uma Reservation para uma Accommodation, informando período e número de hóspedes.
        Booking valida a solicitação de forma síncrona contra Catalog (existência, status ativo, capacidade
        e disponibilidade) e, se válida, cria a Reservation em estado `solicitada` com preço por noite,
        moeda e valor total congelados a partir da resposta de Catalog. Nenhuma Reservation é criada se
        qualquer regra de negócio for violada ou se a validação síncrona não puder ser concluída.
      operationId: requestReservation
      tags:
        - Reservations
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            examples:
              solicitacaoValida:
                summary: Solicitação válida de 3 noites para 2 hóspedes
                value:
                  accommodationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  guestReference: "guest-marina-alves"
                  checkIn: "2026-10-10"
                  checkOut: "2026-10-13"
                  guestsCount: 2
      responses:
        "201":
          description: >-
            Reservation criada em estado `solicitada`, com preço, moeda e valor total congelados.
          headers:
            Location:
              description: >-
                URI da Reservation criada. A consulta por este URI é entregue pela feature Booking F02
                (Consulta de Reserva), fora do escopo deste contrato.
              schema:
                type: string
                format: uri
                examples:
                  - "/v1/reservations/8f14e45f-ceea-467e-a5f0-3f9e6d3d0b1e"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ReservationRejected"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-frontend-notes: >-
        Em 422, use o campo `code` do Problem Details para orientar qual dado da solicitação corrigir
        (período, hóspedes, acomodação). Em 503, exiba como falha temporária ("tente novamente"), nunca
        como rejeição — o Guest não fez nada errado (AC de RF-01).
      x-backend-notes: >-
        A chamada síncrona a Catalog (`GET /accommodations/{accommodationId}/availability-check`, tag
        Catalog Availability (dependency)) precisa de timeout explícito; qualquer falha ou erro inesperado
        dessa chamada deve resultar em 503 `CATALOG_INDISPONIVEL`, nunca em 422 — a solicitação não foi
        avaliada, não foi rejeitada por regra de negócio (RF-01, cenário de indisponibilidade de Catalog).

  /accommodations/{accommodationId}/availability-check:
    get:
      summary: Verificar disponibilidade de uma Accommodation
      description: |
        Endpoint síncrono de Catalog usado por Booking para obter, em uma única chamada, os fatos
        necessários para validar uma solicitação de reserva: status ativo, capacidade máxima,
        disponibilidade no período informado e preço por noite vigente. Não decide se a reserva pode ser
        criada — quem aplica as regras de negócio (RN-02 a RN-06) é Booking, com base nestes fatos.
      operationId: checkAccommodationAvailability
      tags:
        - Catalog Availability (dependency)
      security: []
      servers:
        - url: http://localhost:5010/v1
          description: Catalog — desenvolvimento local (dependência)
      parameters:
        - name: accommodationId
          in: path
          required: true
          description: Identificador único da Accommodation.
          schema:
            type: string
            format: uuid
            examples:
              - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        - name: checkIn
          in: query
          required: true
          description: Data de check-in (início do período, inclusivo).
          schema:
            type: string
            format: date
            examples:
              - "2026-10-10"
        - name: checkOut
          in: query
          required: true
          description: Data de check-out (fim do período, exclusivo).
          schema:
            type: string
            format: date
            examples:
              - "2026-10-13"
        - name: guestsCount
          in: query
          required: true
          description: Número de hóspedes da solicitação, para checagem de capacidade.
          schema:
            type: integer
            minimum: 1
            examples:
              - 2
      responses:
        "200":
          description: Accommodation encontrada; corpo traz os fatos para Booking validar a solicitação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityCheckResponse"
              examples:
                disponivel:
                  summary: Accommodation ativa, com capacidade e disponível no período
                  value:
                    accommodationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    active: true
                    maxGuests: 4
                    availableForPeriod: true
                    pricePerNight: "350.00"
                    currency: "BRL"
        "404":
          description: Accommodation não encontrada em Catalog.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                naoEncontrada:
                  summary: Accommodation inexistente
                  value:
                    type: "https://localize-stay.lab/problems/accommodation-not-found"
                    title: "Accommodation não encontrada"
                    status: 404
                    detail: "Nenhuma Accommodation existe com o identificador informado."
                    instance: "/v1/accommodations/3fa85f64-5717-4562-b3fc-2c963f66afa6/availability-check"
                    code: "ACCOMMODATION_NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-backend-notes: >-
        Contrato mínimo/provisório: representa apenas os dados que Booking F01 precisa (RN-04). Quando
        Catalog F04 (Consulta de Disponibilidade) ganhar seu próprio PRD, este path deve ser substituído
        pelo contrato oficial de Catalog e removido daqui.

# ─── Components ──────────────────────────────────────────────────────────────
components:

  responses:
    BadRequest:
      description: >-
        Requisição malformada — campo ausente, tipo inválido ou fora do formato esperado (não é uma
        rejeição de regra de negócio).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            camposInvalidos:
              summary: Campo obrigatório ausente
              value:
                type: "https://localize-stay.lab/problems/validation-error"
                title: "Requisição inválida"
                status: 400
                detail: "O campo 'accommodationId' é obrigatório."
                instance: "/v1/reservations"
                code: "VALIDATION_ERROR"

    ReservationRejected:
      description: >-
        Solicitação bem formada, mas rejeitada por violar uma regra de negócio de RF-01. Nenhuma
        Reservation é criada. O campo `code` identifica o motivo exato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            periodoInvalido:
              summary: Check-out não é posterior ao check-in
              value:
                type: "https://localize-stay.lab/problems/periodo-invalido"
                title: "Período inválido"
                status: 422
                detail: "A data de check-out deve ser posterior à data de check-in."
                instance: "/v1/reservations"
                code: "PERIODO_INVALIDO"
            quantidadeHospedesInvalida:
              summary: Número de hóspedes menor ou igual a zero
              value:
                type: "https://localize-stay.lab/problems/quantidade-hospedes-invalida"
                title: "Quantidade de hóspedes inválida"
                status: 422
                detail: "O número de hóspedes deve ser maior que zero."
                instance: "/v1/reservations"
                code: "QUANTIDADE_HOSPEDES_INVALIDA"
            acomodacaoIndisponivel:
              summary: Accommodation inexistente ou Property/Accommodation inativa
              value:
                type: "https://localize-stay.lab/problems/acomodacao-indisponivel"
                title: "Acomodação indisponível"
                status: 422
                detail: "A Accommodation informada não existe ou não está ativa."
                instance: "/v1/reservations"
                code: "ACOMODACAO_INDISPONIVEL"
            capacidadeExcedida:
              summary: Número de hóspedes excede a capacidade máxima
              value:
                type: "https://localize-stay.lab/problems/capacidade-excedida"
                title: "Capacidade excedida"
                status: 422
                detail: "O número de hóspedes solicitado excede a capacidade máxima da Accommodation."
                instance: "/v1/reservations"
                code: "CAPACIDADE_EXCEDIDA"
            periodoIndisponivel:
              summary: Accommodation indisponível em algum trecho do período
              value:
                type: "https://localize-stay.lab/problems/periodo-indisponivel"
                title: "Período indisponível"
                status: 422
                detail: "A Accommodation não está disponível em todo o período solicitado."
                instance: "/v1/reservations"
                code: "PERIODO_INDISPONIVEL"

    CatalogUnavailable:
      description: >-
        A validação síncrona com Catalog não pôde ser concluída (Catalog indisponível ou erro
        inesperado). Nenhuma Reservation é criada; isto não é uma rejeição de negócio — o solicitante
        pode tentar novamente.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            catalogIndisponivel:
              summary: Catalog indisponível ou retornou erro inesperado
              value:
                type: "https://localize-stay.lab/problems/catalog-indisponivel"
                title: "Não foi possível validar a solicitação no momento"
                status: 503
                detail: "A consulta síncrona a Catalog falhou. Tente novamente em instantes."
                instance: "/v1/reservations"
                code: "CATALOG_INDISPONIVEL"
                traceId: "abc123xyz"

    InternalServerError:
      description: Erro interno inesperado do servidor.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            erroInterno:
              summary: Erro inesperado
              value:
                type: "about:blank"
                title: "Erro interno"
                status: 500
                detail: "Ocorreu um erro interno. Tente novamente mais tarde."
                instance: "/v1/reservations"
                code: "INTERNAL_ERROR"
                traceId: "abc123xyz"

  schemas:

    # ── Entidade principal ──
    Reservation:
      type: object
      description: Compromisso solicitado por um Guest para ocupar uma Accommodation em um período.
      required:
        - id
        - accommodationId
        - guestReference
        - checkIn
        - checkOut
        - guestsCount
        - status
        - pricePerNight
        - currency
        - totalAmount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da Reservation.
          examples:
            - "8f14e45f-ceea-467e-a5f0-3f9e6d3d0b1e"
        accommodationId:
          type: string
          format: uuid
          description: Identificador da Accommodation reservada, referenciado a Catalog.
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        guestReference:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Guest de referência — identificador informado por quem solicita, sem autenticação nem
            validação de identidade real na Fase 0 (PD-002).
          examples:
            - "guest-marina-alves"
        checkIn:
          type: string
          format: date
          description: Data de check-in (início do período, inclusivo).
          examples:
            - "2026-10-10"
        checkOut:
          type: string
          format: date
          description: Data de check-out (fim do período, exclusivo). Deve ser posterior ao check-in.
          examples:
            - "2026-10-13"
        guestsCount:
          type: integer
          minimum: 1
          description: Quantidade de hóspedes da reserva.
          examples:
            - 2
        status:
          type: string
          enum: [solicitada, confirmada, cancelada]
          description: |
            Estado da Reservation no ciclo de vida da saga (`domains/booking/domain.md`):
            - `solicitada`: criada por esta operação, aguardando o resultado do pagamento (F03/F04).
            - `confirmada`: estado terminal após autorização de pagamento (fora do escopo de F01).
            - `cancelada`: estado terminal após rejeição de pagamento (fora do escopo de F01).
          examples:
            - "solicitada"
        pricePerNight:
          type: string
          description: >-
            Preço por noite congelado no momento da solicitação, devolvido por Catalog. String decimal
            com 2 casas.
          examples:
            - "350.00"
        currency:
          type: string
          enum: [BRL]
          description: Moeda do laboratório, fixa em Real brasileiro (PD-001).
          examples:
            - "BRL"
        totalAmount:
          type: string
          description: >-
            Valor total congelado (número de noites × preço por noite). String decimal com 2 casas.
          examples:
            - "1050.00"
        createdAt:
          type: string
          format: date-time
          description: Data e hora de criação da Reservation (ISO 8601).
          examples:
            - "2026-09-12T14:22:00Z"

    ReservationResponse:
      type: object
      description: Response de uma Reservation recém-criada.
      allOf:
        - $ref: "#/components/schemas/Reservation"

    # ── Requests ──
    CreateReservationRequest:
      type: object
      required:
        - accommodationId
        - guestReference
        - checkIn
        - checkOut
        - guestsCount
      properties:
        accommodationId:
          type: string
          format: uuid
          description: Identificador da Accommodation a reservar.
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        guestReference:
          type: string
          minLength: 1
          maxLength: 255
          description: Guest de referência informado por quem solicita (PD-002).
          examples:
            - "guest-marina-alves"
        checkIn:
          type: string
          format: date
          description: Data de check-in.
          examples:
            - "2026-10-10"
        checkOut:
          type: string
          format: date
          description: Data de check-out; deve ser posterior ao check-in.
          examples:
            - "2026-10-13"
        guestsCount:
          type: integer
          minimum: 1
          description: Quantidade de hóspedes.
          examples:
            - 2

    # ── Dependência de Catalog ──
    AvailabilityCheckResponse:
      type: object
      description: >-
        Fatos de Catalog sobre uma Accommodation, usados por Booking para aplicar suas próprias regras
        de negócio (RN-02 a RN-06). Não representa uma decisão de aceitar ou rejeitar a reserva.
      required:
        - accommodationId
        - active
        - maxGuests
        - availableForPeriod
        - pricePerNight
        - currency
      properties:
        accommodationId:
          type: string
          format: uuid
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        active:
          type: boolean
          description: "`true` quando a Property e a Accommodation estão ambas com status ativo (Catalog RN-02)."
          examples:
            - true
        maxGuests:
          type: integer
          description: Capacidade máxima de hóspedes da Accommodation (Catalog RN-03).
          examples:
            - 4
        availableForPeriod:
          type: boolean
          description: >-
            `true` quando não há Availability Block sobrepondo o período `[checkIn, checkOut)`
            (Catalog RN-04).
          examples:
            - true
        pricePerNight:
          type: string
          description: Preço por noite vigente no momento da consulta (Catalog RN-06). String decimal com 2 casas.
          examples:
            - "350.00"
        currency:
          type: string
          enum: [BRL]
          examples:
            - "BRL"

    # ── Erros (RFC 9457 — Problem Details) ──
    ProblemDetails:
      type: object
      description: >-
        Formato de erro padrão (RFC 9457), usado em toda resposta 4xx/5xx deste contrato, com
        `Content-Type: application/problem+json`.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI estável que identifica o tipo do problema; `about:blank` para erros genéricos.
          examples:
            - "https://localize-stay.lab/problems/periodo-invalido"
        title:
          type: string
          description: Resumo curto e legível por humano do problema.
          examples:
            - "Período inválido"
        status:
          type: integer
          description: Código de status HTTP repetido no corpo, igual ao da resposta.
          examples:
            - 422
        detail:
          type:
            - string
            - "null"
          description: Explicação específica desta ocorrência do problema.
          examples:
            - "A data de check-out deve ser posterior à data de check-in."
        instance:
          type:
            - string
            - "null"
          description: URI que identifica esta ocorrência específica do problema.
          examples:
            - "/v1/reservations"
        code:
          type:
            - string
            - "null"
          enum:
            - VALIDATION_ERROR
            - PERIODO_INVALIDO
            - QUANTIDADE_HOSPEDES_INVALIDA
            - ACOMODACAO_INDISPONIVEL
            - CAPACIDADE_EXCEDIDA
            - PERIODO_INDISPONIVEL
            - CATALOG_INDISPONIVEL
            - ACCOMMODATION_NOT_FOUND
            - INTERNAL_ERROR
          description: >-
            Extensão de RFC 9457: código legível por máquina, estável entre versões, usado pelo
            frontend para decidir como reagir sem fazer parsing de `title`/`detail`.
          examples:
            - "PERIODO_INVALIDO"
        traceId:
          type:
            - string
            - "null"
          description: Identificador de rastreamento para depuração, presente em erros 5xx.
          examples:
            - "abc123xyz"
