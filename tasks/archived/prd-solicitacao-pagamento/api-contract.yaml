# Contrato assíncrono (AsyncAPI) para a feature Booking F03 — Solicitação de Pagamento.
#
# Nota de escopo desta skill: tsg-flow-contract-creator gera OpenAPI/REST por padrão. F03 não introduz
# nenhum endpoint HTTP (PRD, Restrições Técnicas de Alto Nível) — é inteiramente um evento assíncrono
# via RabbitMQ (ADR-002). Por decisão explícita do usuário, este contrato foi gerado em AsyncAPI 3.1,
# seguindo o padrão já estabelecido em contracts/asyncapi/diagnostics-v1.yaml (mesmo broker/vhost,
# mesma convenção de correlationId/causationId e envelope CloudEvents), em vez de OpenAPI.

asyncapi: 3.1.0

info:
  title: "Booking - Solicitação de Pagamento"
  description: |
    Contrato assíncrono para a feature Booking F03 — Solicitação de Pagamento (RF-01).

    **Contrato gerado a partir do PRD:** `tasks/prd-solicitacao-pagamento/prd.md`
    **Data de geração:** 2026-09-12

    ## Premissas Adotadas
    - **Protocolo:** RabbitMQ/AMQP (ADR-002), no vhost dedicado `/localize-stay` do broker
      compartilhado `ecad-dev-rabbitmq` — mesma topologia comprovada em
      `contracts/asyncapi/diagnostics-v1.yaml`.
    - **Versionamento:** versão embutida no tipo do evento (`PaymentRequested.v1`), conforme
      `context/architecture-baseline.md` §Padrões de Comunicação.
    - **Exchange/routing key:** modelados 1:1 com o evento (ADR-002) — exchange topic
      `booking.payment_requested`, routing key `booking.payment_requested`, seguindo a convenção
      `<domínio>.<propósito>` de `domains/booking/domain.md` §7.
    - **Moeda:** Real brasileiro (BRL) fixo em todo valor monetário (PD-001) — mesma convenção de
      `tasks/prd-solicitacao-reserva/api-contract.yaml` e `tasks/prd-consulta-reserva/api-contract.yaml`.
    - **Valores monetários:** string decimal com 2 casas (ex.: `"1050.00"`), nunca número de ponto
      flutuante — mesma convenção de F01/F02.
    - **Identificador de correlação:** `correlationId` é o identificador próprio da Reservation Saga
      (`domains/booking/domain.md` §3), o mesmo valor exposto por Booking F02 no campo `correlationId`
      — **não** é o `id`/`reservationId` da Reservation (são identificadores distintos).
    - **Causation:** este evento inicia a etapa assíncrona da saga a partir da criação síncrona da
      Reservation (F01), sem reagir a nenhum evento anterior; por isso `causationId == correlationId`
      nesta publicação, mesma convenção adotada em `contracts/asyncapi/diagnostics-v1.yaml` para a
      origem de uma cadeia de correlação.
    - **Nomenclatura:** `camelCase` nos campos do payload.
    - **Isolamento de domínio (Restrições Técnicas do PRD):** o payload carrega apenas o que Payment
      precisa para decidir a autorização — `correlationId`, `totalAmount` e `currency`. Não inclui
      `reservationId`, dados de Accommodation, de Guest, nem `pricePerNight`/período/hóspedes.
    - **Escopo:** este documento cobre apenas a publicação (`send`) de `booking.payment_requested`
      pelo Booking (RF-01, caminho de sucesso). O lado de consumo (fila e binding de Payment) é uma
      decisão da própria feature de Payment que reagirá a este evento — ainda sem PRD/contrato
      próprio nesta etapa (ver Questões em Aberto). Uma falha ao publicar (DP-02) não produz nenhuma
      mensagem nem evento de compensação nesta fase — é tratada como log interno do Booking, fora do
      escopo de um contrato de mensageria; Outbox/retry ficam para F06.
  version: "1.0.0"
  contact:
    name: "Domínio Booking — Localize Stay Booking Lab"

servers:
  rabbitmq:
    host: ecad-dev-rabbitmq:5672
    protocol: amqp
    pathname: /localize-stay
    description: >-
      Broker compartilhado com o projeto ecad-sba; o Localize Stay usa o vhost dedicado
      /localize-stay — nenhum recurso fora dele é declarado ou consumido por este projeto
      (mesmo broker de `contracts/asyncapi/diagnostics-v1.yaml`).

operations:
  publishPaymentRequested:
    action: send
    summary: Booking publica PaymentRequested.v1 após criar a Reservation com sucesso (F01 → F03)
    description: |
      Disparado automaticamente na sequência da criação bem-sucedida de uma Reservation em
      `solicitada` por F01 (RF-01, DP-01) — nenhuma ação externa aciona esta publicação. Carrega o
      identificador de correlação da Reservation Saga e o valor total/moeda já congelados na
      Reservation (RN-06), sem recalcular nada no momento da publicação.
    channel:
      $ref: '#/channels/paymentRequestedPublish'
    messages:
      - $ref: '#/channels/paymentRequestedPublish/messages/paymentRequested'

channels:
  paymentRequestedPublish:
    address: booking.payment_requested
    description: >-
      Routing key booking.payment_requested publicada na exchange booking.payment_requested (topic,
      durable) — exchange modelada 1:1 com o evento, conforme ADR-002. O binding de fila para consumo
      por Payment é definido pela própria feature de Payment que reagirá a este evento.
    messages:
      paymentRequested:
        $ref: '#/components/messages/paymentRequested'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: booking.payment_requested
          type: topic
          durable: true
          autoDelete: false
          vhost: /localize-stay
        bindingVersion: 0.3.0

components:
  messages:
    paymentRequested:
      name: PaymentRequested
      title: PaymentRequested.v1
      summary: >-
        Solicitação de autorização de pagamento para uma Reservation, com o valor congelado e o
        identificador de correlação da saga (RF-01).
      contentType: application/json
      correlationId:
        location: $message.header#/x-correlation-id
        description: >-
          Correlação ponta a ponta com a Reservation Saga. Esta publicação origina a etapa
          assíncrona da saga: causationId == correlationId neste evento.
      headers:
        type: object
        required:
          - x-correlation-id
          - x-causation-id
        properties:
          x-correlation-id:
            type: string
            description: Correlation ID propagado em todo log de mensageria (mesmo valor do payload).
          x-causation-id:
            type: string
            description: Causation ID (igual ao correlationId nesta publicação).
      payload:
        type: object
        required:
          - correlationId
          - causationId
          - totalAmount
          - currency
          - requestedAt
        properties:
          correlationId:
            type: string
            format: uuid
            description: >-
              Identificador da Reservation Saga (não é o id da Reservation) — mesmo valor exposto por
              Booking F02 no campo `correlationId`.
            examples:
              - "b2c4e6a8-1234-4abc-9def-0123456789ab"
          causationId:
            type: string
            format: uuid
            description: Causation ID (== correlationId nesta publicação, que origina a etapa assíncrona).
            examples:
              - "b2c4e6a8-1234-4abc-9def-0123456789ab"
          totalAmount:
            type: string
            description: >-
              Valor total solicitado a Payment (RN-06) — string decimal com 2 casas, idêntico ao
              congelado na Reservation no momento da criação (F01). Nunca recalculado na publicação.
            examples:
              - "1050.00"
          currency:
            type: string
            enum: [BRL]
            description: Moeda do laboratório, fixa em Real brasileiro (PD-001).
            examples:
              - "BRL"
          requestedAt:
            type: string
            format: date-time
            description: Instante UTC em que Booking publicou a solicitação de pagamento.
            examples:
              - "2026-09-12T14:22:05Z"
      traits:
        - $ref: '#/components/messageTraits/cloudEventsEnvelope'
      examples:
        - name: paymentRequestedExample
          summary: >-
            Solicitação de pagamento para a mesma Reservation do exemplo "pagamentoPendente" de
            Booking F02 (id 8f14e45f-ceea-467e-a5f0-3f9e6d3d0b1e, totalAmount 1050.00).
          payload:
            correlationId: "b2c4e6a8-1234-4abc-9def-0123456789ab"
            causationId: "b2c4e6a8-1234-4abc-9def-0123456789ab"
            totalAmount: "1050.00"
            currency: "BRL"
            requestedAt: "2026-09-12T14:22:05Z"
          headers:
            x-correlation-id: "b2c4e6a8-1234-4abc-9def-0123456789ab"
            x-causation-id: "b2c4e6a8-1234-4abc-9def-0123456789ab"

  messageTraits:
    cloudEventsEnvelope:
      description: >-
        Transporte via Rmq.CloudEvents: o payload viaja no campo `data` de um envelope CloudEvents
        com type `com.localizestay.booking.payment_requested.v1` e source `/booking`; os IDs de
        correlação vão também nos headers AMQP x-correlation-id/x-causation-id — mesma convenção de
        `contracts/asyncapi/diagnostics-v1.yaml`.
