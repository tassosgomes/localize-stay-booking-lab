openapi: 3.1.0

info:
  title: Localize Stay Catalog API — Cadastro de Property
  version: 1.0.0
  contact:
    name: Localize Stay Lab
  description: |
    Contrato da F01 para criar e editar os dados cadastrais de uma Property.
    A Fase 0 não autentica atores: o solicitante informa um identificador fictício
    de Host no header `X-Host-Reference-Id`.

servers:
  - url: /v1
    description: Base path versionado, relativo ao host do serviço Catalog

security: []

tags:
  - name: Properties
    description: Cadastro e manutenção dos dados básicos de hospedagens.

paths:
  /properties:
    post:
      summary: Cadastrar property
      description: |
        Cria uma Property ativa. O Host informado no header torna-se seu responsável.
        Nome e localização iguais aos de outra Property são aceitos.
      operationId: createProperty
      tags:
        - Properties
      security: []
      parameters:
        - $ref: '#/components/parameters/HostReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
            examples:
              pousada:
                summary: Cadastro válido de uma pousada
                value:
                  name: Pousada Dunas do Sol
                  location: Cumbuco, Caucaia - CE
      responses:
        '201':
          description: Property cadastrada com sucesso.
          headers:
            Location:
              description: Caminho versionado da Property cadastrada.
              schema:
                type: string
                examples:
                  - /v1/properties/8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              examples:
                criada:
                  summary: Property criada e ativa
                  value:
                    id: 8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
                    name: Pousada Dunas do Sol
                    location: Cumbuco, Caucaia - CE
                    hostReferenceId: 421ec5d4-3ba2-4d8e-8958-a51dd0711650
                    status: active
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-frontend-notes: Preserve os valores digitados e associe cada item de details ao campo correspondente.
      x-backend-notes: A criação é atômica; não aplique unicidade por nome e localização.

  /properties/{propertyId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    patch:
      summary: Editar dados da property
      description: |
        Altera nome e/ou localização. Identificador, Host responsável e status não
        são editáveis. O header deve identificar o Host responsável atual.
      operationId: updateProperty
      tags:
        - Properties
      security: []
      parameters:
        - $ref: '#/components/parameters/HostReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
            examples:
              nomeELocalizacao:
                summary: Alteração dos dois campos editáveis
                value:
                  name: Pousada Dunas do Sol Boutique
                  location: Praia de Cumbuco, Caucaia - CE
              somenteNome:
                summary: Alteração parcial do nome
                value:
                  name: Pousada Dunas do Sol Boutique
      responses:
        '200':
          description: Dados cadastrais atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              examples:
                atualizada:
                  summary: Property após a alteração
                  value:
                    id: 8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
                    name: Pousada Dunas do Sol Boutique
                    location: Praia de Cumbuco, Caucaia - CE
                    hostReferenceId: 421ec5d4-3ba2-4d8e-8958-a51dd0711650
                    status: active
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/HostOwnershipForbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-frontend-notes: Envie apenas os campos alterados e preserve o formulário quando houver erro.
      x-backend-notes: Valide ownership antes de alterar e persista toda a edição atomicamente.

components:
  parameters:
    HostReferenceId:
      name: X-Host-Reference-Id
      in: header
      required: true
      description: |
        Identificador fictício do Host solicitante. Não constitui autenticação nem
        prova de identidade na Fase 0.
      schema:
        type: string
        format: uuid
        examples:
          - 421ec5d4-3ba2-4d8e-8958-a51dd0711650
    PropertyId:
      name: propertyId
      in: path
      required: true
      description: Identificador estável da Property.
      schema:
        type: string
        format: uuid
        examples:
          - 8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a

  responses:
    ValidationError:
      description: Requisição inválida, sem criação ou alteração parcial.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            camposInvalidos:
              summary: Campos obrigatórios inválidos
              value:
                type: https://localize-stay.example/problems/validation-error
                title: Dados inválidos
                status: 400
                detail: Corrija os campos indicados e tente novamente.
                instance: /v1/properties
                code: VALIDATION_ERROR
                details:
                  - field: name
                    message: O nome não pode conter apenas espaços.
                  - field: location
                    message: A localização deve ter no máximo 500 caracteres.
                traceId: 4f75b9ff793eef884ad28e7d65c2832b
    HostOwnershipForbidden:
      description: O Host informado não é o responsável pela Property.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            hostSemOwnership:
              summary: Host solicitante não é o responsável
              value:
                type: https://localize-stay.example/problems/host-ownership-forbidden
                title: Operação não permitida
                status: 403
                detail: Somente o Host responsável pode editar esta Property.
                instance: /v1/properties/8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
                code: HOST_OWNERSHIP_FORBIDDEN
                details: []
                traceId: 1acfc080c9a001b9ea65431bdb96c41d
    PropertyNotFound:
      description: Nenhuma Property existe com o identificador informado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            naoEncontrada:
              summary: Property não encontrada
              value:
                type: https://localize-stay.example/problems/property-not-found
                title: Property não encontrada
                status: 404
                detail: Não foi encontrada uma Property com o identificador informado.
                instance: /v1/properties/8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
                code: PROPERTY_NOT_FOUND
                details: []
                traceId: 52edff98e1aa0f34efe3d36319111fae
    InternalServerError:
      description: Falha inesperada; nenhuma alteração parcial deve permanecer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            falhaInesperada:
              summary: Erro interno inesperado
              value:
                type: https://localize-stay.example/problems/internal-error
                title: Erro interno
                status: 500
                detail: Ocorreu um erro inesperado. Tente novamente mais tarde.
                instance: /v1/properties
                code: INTERNAL_ERROR
                details: []
                traceId: ec311ea9451e7699887f9097b692f049

  schemas:
    Property:
      type: object
      description: Hospedagem cadastrada no domínio Catalog.
      additionalProperties: false
      required:
        - id
        - name
        - location
        - hostReferenceId
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Identificador público e estável da Property.
          examples:
            - 8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
          description: Nome da hospedagem; deve conter ao menos um caractere não branco.
          examples:
            - Pousada Dunas do Sol
        location:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Localização textual livre; deve conter ao menos um caractere não branco.
          examples:
            - Cumbuco, Caucaia - CE
        hostReferenceId:
          type: string
          format: uuid
          description: Identificador fictício do Host responsável.
          examples:
            - 421ec5d4-3ba2-4d8e-8958-a51dd0711650
        status:
          type: string
          enum:
            - active
            - inactive
          description: '`active` indica cadastro utilizável; `inactive` fica reservado à F07.'
          examples:
            - active
      examples:
        - id: 8ce29b2c-e67e-4a7d-bb3d-2ed87310f28a
          name: Pousada Dunas do Sol
          location: Cumbuco, Caucaia - CE
          hostReferenceId: 421ec5d4-3ba2-4d8e-8958-a51dd0711650
          status: active

    CreatePropertyRequest:
      type: object
      description: Dados necessários para cadastrar uma Property.
      additionalProperties: false
      required:
        - name
        - location
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
          description: Nome da hospedagem; deve conter ao menos um caractere não branco.
          examples:
            - Pousada Dunas do Sol
        location:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Localização textual livre; deve conter ao menos um caractere não branco.
          examples:
            - Cumbuco, Caucaia - CE
      examples:
        - name: Pousada Dunas do Sol
          location: Cumbuco, Caucaia - CE

    UpdatePropertyRequest:
      type: object
      description: Alteração parcial restrita ao nome e à localização da Property.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
          description: Novo nome; deve conter ao menos um caractere não branco.
          examples:
            - Pousada Dunas do Sol Boutique
        location:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Nova localização textual; deve conter ao menos um caractere não branco.
          examples:
            - Praia de Cumbuco, Caucaia - CE
      examples:
        - name: Pousada Dunas do Sol Boutique

    ProblemDetails:
      type: object
      description: Erro HTTP no formato RFC 9457 com extensões do domínio.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - details
        - traceId
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica a categoria do problema.
          examples:
            - https://localize-stay.example/problems/validation-error
        title:
          type: string
          description: Resumo estável e legível do problema.
          examples:
            - Dados inválidos
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP desta ocorrência.
          examples:
            - 400
        detail:
          type: string
          description: Explicação específica desta ocorrência.
          examples:
            - Corrija os campos indicados e tente novamente.
        instance:
          type: string
          description: Caminho da requisição que originou o problema.
          examples:
            - /v1/properties
        code:
          type: string
          description: Código estável para tratamento programático pelo consumidor.
          examples:
            - VALIDATION_ERROR
        details:
          type: array
          description: Erros associados a campos; retorna lista vazia quando não se aplica.
          items:
            $ref: '#/components/schemas/ProblemDetailItem'
        traceId:
          type: string
          description: Identificador de correlação da ocorrência nos logs.
          examples:
            - 4f75b9ff793eef884ad28e7d65c2832b

    ProblemDetailItem:
      type: object
      description: Erro de validação associado a um campo da requisição.
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Nome JSON ou header inválido.
          examples:
            - name
        message:
          type: string
          description: Mensagem legível sobre como corrigir o campo.
          examples:
            - O nome não pode conter apenas espaços.
