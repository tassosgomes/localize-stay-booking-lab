name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet_matrix: ${{ steps.matrix.outputs.matrix }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            catalog:
              - 'services/catalog/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'NuGet.Config'
            booking:
              - 'services/booking/**'
              - 'services/notification-worker/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'NuGet.Config'
            payment:
              - 'services/payment/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'NuGet.Config'
            notification_worker:
              - 'services/notification-worker/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'NuGet.Config'
            frontend:
              - 'frontend/localize-stay-frontend/**'

      # dorny/paths-filter só diz o que mudou; nome de pasta e nome de .sln
      # não são 1:1 (ex.: notification-worker -> LocalizeStay.Notification.sln),
      # então montamos aqui um item completo por serviço afetado.
      - name: Build dotnet matrix
        id: matrix
        run: |
          declare -A SLN=(
            [catalog]="services/catalog/LocalizeStay.Catalog.sln"
            [booking]="services/booking/LocalizeStay.Booking.sln"
            [payment]="services/payment/LocalizeStay.Payment.sln"
            [notification-worker]="services/notification-worker/LocalizeStay.Notification.sln"
          )
          declare -A HAS_TESTS=(
            [catalog]=true
            [booking]=true
            [payment]=true
            [notification-worker]=false
          )
          declare -A CHANGED=(
            [catalog]="${{ steps.filter.outputs.catalog }}"
            [booking]="${{ steps.filter.outputs.booking }}"
            [payment]="${{ steps.filter.outputs.payment }}"
            [notification-worker]="${{ steps.filter.outputs.notification_worker }}"
          )

          ITEMS='[]'
          for name in catalog booking payment notification-worker; do
            if [[ "${CHANGED[$name]}" == "true" ]]; then
              ITEMS=$(jq -c \
                --arg service "$name" \
                --arg sln "${SLN[$name]}" \
                --arg dockerfile "services/$name/Dockerfile" \
                --arg image "$name" \
                --argjson has_tests "${HAS_TESTS[$name]}" \
                '. + [{service: $service, sln: $sln, dockerfile: $dockerfile, image: $image, has_tests: $has_tests}]' \
                <<<"$ITEMS")
            fi
          done
          echo "matrix=$ITEMS" >> "$GITHUB_OUTPUT"

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.dotnet_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "${{ matrix.sln }}"

      - name: Build
        run: dotnet build "${{ matrix.sln }}" -c Release --no-restore

      # Testcontainers (Postgres/RabbitMQ) usa o Docker do próprio runner.
      - name: Test
        if: matrix.has_tests
        run: dotnet test "${{ matrix.sln }}" -c Release --no-build --logger "console;verbosity=normal"

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Login só é necessário quando vamos publicar (merge na main).
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR: builda e carrega local (valida o Dockerfile), sem push.
      # push/main: builda e publica no GHCR.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: ${{ github.event_name == 'push' }}

      - name: Primary tag for scan
        id: primary_tag
        run: echo "tag=$(head -n1 <<< '${{ steps.meta.outputs.tags }}')" >> "$GITHUB_OUTPUT"

      # Scan de segurança sempre roda e nunca falha o job (severidade só reportada).
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.primary_tag.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/localize-stay-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/localize-stay-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite build)
        run: npm run build

      - name: Test (vitest)
        run: npm test

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: frontend/localize-stay-frontend
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: ${{ github.event_name == 'push' }}

      - name: Primary tag for scan
        id: primary_tag
        run: echo "tag=$(head -n1 <<< '${{ steps.meta.outputs.tags }}')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.primary_tag.outputs.tag }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # Roda no runner self-hosted (LAN do infra) porque precisa falar
  # diretamente com o postgres-main. Migration é passo de deploy, nunca de
  # boot da aplicação (ver README.md) — por isso vive aqui, não no container.
  migrate:
    needs: [changes, dotnet]
    if: github.event_name == 'push' && needs.changes.outputs.dotnet_matrix != '[]'
    runs-on: [self-hosted, homelab]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.dotnet_matrix) }}
    env:
      POSTGRES_HOST: ${{ vars.POSTGRES_MAIN_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_MAIN_PORT }}
      CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
      BOOKING_DB_PASSWORD: ${{ secrets.BOOKING_DB_PASSWORD }}
      PAYMENT_DB_PASSWORD: ${{ secrets.PAYMENT_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.service != 'notification-worker'

      - uses: actions/setup-dotnet@v6
        if: matrix.service != 'notification-worker'
        # Runner self-hosted não roda como root (sem docker.sock, sem
        # privilégio) — /usr/share/dotnet (default do setup-dotnet) não é
        # gravável; instala num diretório do próprio workspace do job.
        # (runner.temp só é resolvível em env de step, não de job.)
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-migrate
        with:
          dotnet-version: '10.0.x'

      # O repo já versiona .config/dotnet-tools.json (raiz, isRoot: true,
      # dotnet-ef pinado). `dotnet ef` sempre resolve por esse manifesto de
      # local tool primeiro quando ele existe — `dotnet tool install
      # --tool-path` (versão anterior deste step) instalava um dotnet-ef
      # paralelo no PATH que nunca era usado, e falhava com "Run 'dotnet
      # tool restore'...". `dotnet tool restore` restaura no cache do NuGet
      # do usuário (~/.nuget/packages), sem precisar de escrita em
      # /usr/share/dotnet.
      - name: Restore dotnet-ef (local tool)
        if: matrix.service != 'notification-worker'
        run: dotnet tool restore

      - name: Apply migration
        if: matrix.service != 'notification-worker'
        run: |
          case "${{ matrix.service }}" in
            catalog)
              ROLE=catalog_role; PW="$CATALOG_DB_PASSWORD"
              INFRA=services/catalog/src/4-Infra/LocalizeStay.Catalog.Infra
              STARTUP=services/catalog/src/1-Services/LocalizeStay.Catalog.Api
              ENVKEY=ConnectionStrings__Catalog
              ;;
            booking)
              ROLE=booking_role; PW="$BOOKING_DB_PASSWORD"
              INFRA=services/booking/src/4-Infra/LocalizeStay.Booking.Infra
              STARTUP=services/booking/src/1-Services/LocalizeStay.Booking.Api
              ENVKEY=ConnectionStrings__Booking
              ;;
            payment)
              ROLE=payment_role; PW="$PAYMENT_DB_PASSWORD"
              INFRA=services/payment/src/4-Infra/LocalizeStay.Payment.Infra
              STARTUP=services/payment/src/1-Services/LocalizeStay.Payment.Api
              ENVKEY=ConnectionStrings__Payment
              ;;
            *)
              echo "sem migration para ${{ matrix.service }}"
              exit 0
              ;;
          esac
          CONN="Host=$POSTGRES_HOST;Port=$POSTGRES_PORT;Database=localize_stay;Username=$ROLE;Password=$PW"
          export "${ENVKEY}=${CONN}"
          dotnet ef database update --project "$INFRA" --startup-project "$STARTUP"

  # Publica contracts/openapi (conector nativo `rest`), contracts/asyncapi
  # (publicador dedicado — OpenMetadata 2.0.x não tem conector de ingestão
  # nativo para RabbitMQ) e contracts/data-contracts (Custom Properties em
  # tables) no OpenMetadata, além de rodar a ingestão de schema Postgres que
  # antes era um checkpoint manual (ver scripts/openmetadata/README.md).
  # Roda no runner homelab pelo mesmo motivo de migrate/deploy:
  # openmetadata.lab.tasso.dev.br só é alcançável pela LAN do infra.
  catalog-metadata:
    needs: [dotnet, migrate]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.dotnet.result != 'failure' &&
      needs.migrate.result != 'failure'
    runs-on: [self-hosted, homelab]
    env:
      OPENMETADATA_BASE_URL: ${{ vars.OPENMETADATA_BASE_URL }}
      OPENMETADATA_INGESTION_JWT: ${{ secrets.OPENMETADATA_INGESTION_JWT }}
      # Nomes esperados pelos arquivos scripts/openmetadata/ingestion-*.yaml
      # (mesma credencial dos dois de cima, mapeada para as variáveis que o
      # `metadata ingest` substitui via ${VAR}).
      OM_SERVER_HOST_PORT: ${{ vars.OPENMETADATA_BASE_URL }}
      OM_INGESTION_JWT: ${{ secrets.OPENMETADATA_INGESTION_JWT }}
      OM_POSTGRES_PASSWORD: ${{ secrets.OM_POSTGRES_READER_PASSWORD }}
      # Mesmas vars já usadas pelo job migrate para alcançar o postgres-main
      # a partir do runner self-hosted (LAN, fora da rede interna do Coolify).
      OM_POSTGRES_HOST_PORT: ${{ vars.POSTGRES_MAIN_HOST }}:${{ vars.POSTGRES_MAIN_PORT }}
    steps:
      - uses: actions/checkout@v7

      # register-rabbitmq/register-data-contracts referenciam a tag
      # localize-stay.localize-stay (classification "localize-stay" + tag
      # "localize-stay" dentro dela) — sem ela existir, a API responde 404
      # "Entity not found: tag ...". Idempotente: `|| true` absorve o erro
      # quando a classification/tag já existe (create, não upsert).
      - name: Garantir classification/tag localize-stay
        run: |
          curl -sf -X POST "$OPENMETADATA_BASE_URL/v1/classifications" \
            -H "Authorization: Bearer $OPENMETADATA_INGESTION_JWT" -H "Content-Type: application/json" \
            -d '{"name":"localize-stay","description":"Ativos do Localize Stay Booking Lab, para não confundir com o catálogo do ecad-sba no mesmo OpenMetadata."}' \
            || true
          curl -sf -X POST "$OPENMETADATA_BASE_URL/v1/tags" \
            -H "Authorization: Bearer $OPENMETADATA_INGESTION_JWT" -H "Content-Type: application/json" \
            -d '{"name":"localize-stay","classification":"localize-stay","description":"Marca qualquer entidade do Localize Stay Booking Lab."}' \
            || true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Pinado à versão do servidor (2.0.1, ver roteiro.md do infra). Extra
      # `rest` cobre o conector OpenAPI usado abaixo — confirmar no primeiro
      # run real se o nome do extra é este ou se o source `rest` já vem no
      # core do pacote.
      - name: Instalar openmetadata-ingestion
        run: pip install "openmetadata-ingestion[postgres,rest]==2.0.1"

      - name: Ingestão de schema Postgres
        run: metadata ingest -c scripts/openmetadata/ingestion-postgres.yaml

      # openAPISchemaURL do conector `rest` exige http(s), não file://.
      # Serve contracts/openapi/ só em 127.0.0.1, só durante este job.
      - name: Servir contracts/openapi/ localmente
        working-directory: contracts/openapi
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          echo $! > "${{ runner.temp }}/openapi-http-server.pid"
          for _ in $(seq 1 10); do
            curl -sf -o /dev/null http://127.0.0.1:8000/catalog.json && break
            sleep 1
          done

      - name: Ingestão OpenAPI (catalog)
        run: metadata ingest -c scripts/openmetadata/ingestion-openapi-catalog.yaml

      - name: Ingestão OpenAPI (booking)
        run: metadata ingest -c scripts/openmetadata/ingestion-openapi-booking.yaml

      # payment.json ainda não tem paths reais (ver contracts/openapi/) —
      # sem YAML de ingestão até ter conteúdo.

      - name: Encerrar servidor HTTP local
        if: always()
        run: kill "$(cat "${{ runner.temp }}/openapi-http-server.pid")" 2>/dev/null || true

      - uses: actions/setup-dotnet@v6
        # Mesma razão do job migrate: runner self-hosted não é root, sem
        # permissão de escrita em /usr/share/dotnet.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-catalog-metadata
        with:
          dotnet-version: '10.0.x'

      - name: Publicar AsyncAPI no OpenMetadata
        run: dotnet run --project scripts/openmetadata/register-rabbitmq

      - name: Publicar Data Contracts no OpenMetadata
        run: dotnet run --project scripts/openmetadata/register-data-contracts

  # Chama a API do Coolify diretamente (sem docker.sock no runner). Só
  # dispara deploy dos serviços cuja imagem realmente mudou nesse push.
  deploy:
    needs: [changes, dotnet, frontend, migrate]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.dotnet.result != 'failure' &&
      needs.frontend.result != 'failure' &&
      needs.migrate.result != 'failure'
    runs-on: [self-hosted, homelab]
    steps:
      - name: Resolve Coolify resource UUIDs dos serviços alterados
        id: uuids
        run: |
          IDS=()
          if [[ "${{ needs.changes.outputs.frontend_changed }}" == "true" ]]; then
            IDS+=("${{ vars.COOLIFY_FRONTEND_UUID }}")
          fi
          while read -r svc; do
            case "$svc" in
              catalog) IDS+=("${{ vars.COOLIFY_CATALOG_UUID }}") ;;
              booking) IDS+=("${{ vars.COOLIFY_BOOKING_UUID }}") ;;
              payment) IDS+=("${{ vars.COOLIFY_PAYMENT_UUID }}") ;;
              notification-worker) IDS+=("${{ vars.COOLIFY_NOTIFICATION_WORKER_UUID }}") ;;
            esac
          done < <(echo '${{ needs.changes.outputs.dotnet_matrix }}' | jq -r '.[].service')
          JOINED=$(IFS=,; echo "${IDS[*]}")
          echo "uuids=$JOINED" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deploy
        if: steps.uuids.outputs.uuids != ''
        run: |
          curl -sf -X POST "${{ vars.COOLIFY_URL }}/api/v1/deploy?uuid=${{ steps.uuids.outputs.uuids }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
